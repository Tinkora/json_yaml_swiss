name: Supply chain

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    uses: Tinkora/.github/.github/workflows/reusable-supply-chain.yml@e80d6099799b9d372525f1639aa601504fe8d52b
    with:
      working-directory: .
      toolchain: 1.95.0

  npm_audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.11.1'
          cache: npm
          cache-dependency-path: crates/json_yaml_swiss_web/package-lock.json
      - name: Audit npm dependencies
        working-directory: crates/json_yaml_swiss_web
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
