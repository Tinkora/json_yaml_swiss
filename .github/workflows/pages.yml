name: Pages

'on':
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build_site:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Rust and WASM target
        run: |
          rustup toolchain install 1.95.0 --profile minimal --no-self-update
          rustup target add wasm32-unknown-unknown --toolchain 1.95.0
          cargo +1.95.0 install wasm-pack --version 0.15.0 --locked
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.11.1'
          cache: npm
          cache-dependency-path: crates/json_yaml_swiss_web/package-lock.json
      - name: Install web dependencies
        working-directory: crates/json_yaml_swiss_web
        run: npm ci --ignore-scripts
      - name: Build WASM package
        working-directory: crates/json_yaml_swiss_web
        env:
          RUSTUP_TOOLCHAIN: 1.95.0
        run: npm run build:wasm
      - name: Stage static site
        run: |
          set -euo pipefail
          mkdir -p site
          cp -R crates/json_yaml_swiss_web/static/. site/
      - name: Upload site artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pages_site
          path: site
          if-no-files-found: error
          retention-days: 1
  deploy:
    needs: build_site
    permissions:
      contents: read
      id-token: write
      pages: write
    uses: Tinkora/.github/.github/workflows/reusable-pages.yml@e80d6099799b9d372525f1639aa601504fe8d52b
    with:
      source-artifact-name: pages_site
      source-subdirectory: .
